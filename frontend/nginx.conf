server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /__origin_latency_probe {
        proxy_pass http://origin-latency-probe:12071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

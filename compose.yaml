services:
  origin-latency-probe:
    build: .
    image: origin-latency-probe:latest
    container_name: origin-latency-probe
    restart: unless-stopped
    environment:
      PROBE_APP_NAME: p.zshio.de
      PROBE_PORT: "12071"
    ports:
      - "127.0.0.1:12071:12071"
    networks:
      - default
      - 1panel-network

  origin-latency-ui:
    build: ./frontend
    image: origin-latency-ui:latest
    container_name: origin-latency-ui
    restart: unless-stopped
    depends_on:
      - origin-latency-probe
    ports:
      - "127.0.0.1:12072:80"
    networks:
      - default
      - 1panel-network

networks:
  1panel-network:
    external: true
